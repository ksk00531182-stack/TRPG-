<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TRPG Studio | Room</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="shell">
    <section class="entry" id="entry">
      <p class="eyebrow">TRPG STUDIO / REALTIME ROOM</p>
      <h1>同じ卓に、<br><em>同じ声</em>を。</h1>
      <p class="intro">GMとPCが、ルーム内のメッセージでつながるシンプルなセッション通信室。</p>
      <form id="joinForm" class="join-form">
        <label>ルームID<input id="roomId" required pattern="[A-Za-z0-9_-]{1,64}" placeholder="例: moonlit-01"></label>
        <label>表示名<input id="name" required maxlength="40" placeholder="例: 佐藤 / GM"></label>
        <label>参加形態<select id="role"><option value="gm">GM</option><option value="pc">PC</option></select></label>
        <p id="roleHint" class="hint">ルームを作成してPCへURLを共有します</p>
        <button type="submit">ルームに入る <span>→</span></button>
      </form>
      <p class="connection"><span class="status-dot"></span><span id="status">サーバーへ接続しています</span></p>
    </section>
    <section class="room" id="room" hidden>
      <header class="room-header"><div><p class="eyebrow">LIVE SESSION</p><h2 id="roomLabel"></h2></div><button id="copyLink" class="secondary" type="button">PC参加URLをコピー</button></header>
      <section class="assets panel">
        <div class="assets-heading"><div><p class="eyebrow">SCENARIO ASSETS</p><h3>素材ストレージ</h3></div><span id="assetStatus"></span></div>
        <div class="asset-upload gm-only" id="assetUpload" hidden><select id="assetCategory" aria-label="素材カテゴリー"><option value="characters">キャラクター</option><option value="materials">資料</option><option value="icons">アイコン</option><option value="backgrounds">背景</option><option value="bgm">BGM</option></select><label class="file-picker">ファイルを選択<input id="assetFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif,audio/mpeg,audio/ogg,audio/wav" multiple></label></div>
        <div class="asset-list" id="assetList"><p class="empty-assets">素材を読み込んでいます...</p></div>
      </section>
      <div class="room-grid">
        <aside class="members panel"><p class="eyebrow">PLAYERS</p><h3>参加者</h3><ul id="memberList"></ul></aside>
        <section class="chat panel"><div class="chat-heading"><div><p class="eyebrow">MESSAGE CHANNEL</p><h3>セッション通信</h3></div><span id="typing"></span></div><div class="message-list" id="messageList" aria-live="polite"></div><form class="message-form" id="messageForm"><textarea id="messageInput" rows="2" maxlength="2000" placeholder="メッセージを入力..." required></textarea><button type="submit">送信 <span>↗</span></button></form></section>
      </div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body>
</html>
