<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TRPG Studio | Room</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="shell">
    <section class="entry" id="entry">
      <p class="eyebrow">TRPG STUDIO / REALTIME ROOM</p>
      <h1>同じ卓に、<br><em>同じ声</em>を。</h1>
      <p class="intro">GMとPCが、ルーム内のメッセージでつながるシンプルなセッション通信室。</p>
      <form id="joinForm" class="join-form">
        <input id="roomId" type="hidden">
        <label id="systemLabel">TRPGシステム<select id="systemId" required><option value="coc">クトゥルフ神話TRPG</option><option value="emoklore">エモクロアTRPG</option></select></label>
        <label>ルームタイトル<input id="roomTitle" required maxlength="80" placeholder="例: 月影の港"></label>
        <label id="playerIdLabel" hidden>プレイヤーID<input id="playerId" maxlength="40" pattern="[^\s]{1,40}" placeholder="例: sato"></label>
        <label id="nameLabel"><span>GM名</span><input id="name" required maxlength="40" placeholder="例: 佐藤"></label>
        <p id="entryHint" class="hint">GMとして新しいルームを作成します。作成後、PC用招待URLを共有してください。</p>
        <button id="joinButton" type="submit">ルームを作成 <span>→</span></button>
        <button id="roomListButton" class="secondary" type="button">ルーム一覧</button>
      </form>
      <section class="room-library" id="roomLibrary" hidden>
        <div class="room-library-panel"><div class="library-heading"><div><p class="eyebrow">YOUR ROOMS</p><h2>ルーム一覧</h2></div></div>
          <div class="room-list" id="roomList"><p class="empty-rooms">ルームがまだ作成されていません。</p></div>
        </div>
      </section>
      <p class="connection"><span class="status-dot"></span><span id="status">サーバーへ接続しています</span></p>
    </section>
    <section class="room" id="room" hidden>
      <header class="room-header"><div><p class="room-system" id="roomSystem"></p><h2 id="roomLabel"></h2></div><button id="copyLink" class="secondary" type="button">PC参加URLをコピー</button></header>
      <div class="room-grid">
        <main class="play-area" aria-label="プレイエリア">
          <div class="play-area-tools">
            <div class="play-area-tabs" role="tablist" aria-label="プレイエリア素材切り替え">
              <button class="play-area-tab is-active" type="button" role="tab" aria-selected="true" data-asset-category="characters">キャラクター</button>
              <button class="play-area-tab" type="button" role="tab" aria-selected="false" data-asset-category="backgrounds">背景</button>
              <button class="play-area-tab" type="button" role="tab" aria-selected="false" data-asset-category="materials">資料</button>
              <button class="play-area-tab" type="button" role="tab" aria-selected="false" data-asset-category="icons">アイコン</button>
              <button class="play-area-tab" type="button" role="tab" aria-selected="false" data-asset-category="bgm">BGM</button>
            </div>
            <section id="playAreaAssetPanel" class="assets" aria-label="プレイエリア素材" hidden>
              <div class="assets-heading"><span id="assetStatus"></span></div>
              <div class="asset-upload gm-only" id="assetUpload" hidden><select id="assetCategory" aria-label="素材カテゴリー"><option value="characters">キャラクター</option><option value="materials">資料</option><option value="icons">アイコン</option><option value="backgrounds">背景</option><option value="bgm">BGM</option></select><label class="file-picker">サーバーに画像を追加<input id="assetFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif,audio/mpeg,audio/ogg,audio/wav" multiple></label></div>
              <div class="asset-list" id="assetList"><p class="empty-assets">素材を読み込んでいます...</p></div>
            </section>
          </div>
          <p class="play-area-empty">プレイエリア</p>
        </main>
        <aside class="session-sidebar">
        <section class="session-panel panel">
          <div class="panel-tabs" role="tablist" aria-label="セッション表示切り替え">
            <button id="chatTab" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="chatPanel">セッション通信</button>
            <button id="diceTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="dicePanel">ダイスロール</button>
            <button id="membersTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="membersPanel">参加者</button>
            <button id="memoTab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="memoPanel">メモ</button>
          </div>
          <div id="chatPanel" class="tab-panel" role="tabpanel" aria-labelledby="chatTab">
            <div class="chat-heading"><span id="typing"></span></div>
            <div class="message-list" id="messageList" aria-live="polite"></div>
            <form class="message-form" id="messageForm"><select id="messageTarget" aria-label="送信先"><option value="">全体チャット</option></select><textarea id="messageInput" rows="2" maxlength="2000" placeholder="メッセージを入力..." required></textarea><button type="submit">送信 <span>↗</span></button></form>
          </div>
          <div id="dicePanel" class="tab-panel dice-panel" role="tabpanel" aria-labelledby="diceTab" hidden>
            <h3>一般ダイス</h3>
            <label id="secretDiceOption" class="secret-dice-option" hidden><input id="secretDiceInput" type="checkbox"> シークレットダイス</label>
            <label id="diceActorOption" class="dice-actor-option" hidden>ロールするキャラクター<select id="diceActor"><option value="">GM</option></select></label>
            <div class="dice-grid" aria-label="ダイスロール">
              <button type="button" class="dice-button" data-dice-sides="100">1D100</button>
              <button type="button" class="dice-button" data-dice-sides="20">1D20</button>
              <button type="button" class="dice-button" data-dice-sides="12">1D12</button>
              <button type="button" class="dice-button" data-dice-sides="10">1D10</button>
              <button type="button" class="dice-button" data-dice-sides="8">1D8</button>
              <button type="button" class="dice-button" data-dice-sides="6">1D6</button>
              <button type="button" class="dice-button" data-dice-sides="4">1D4</button>
            </div>
          </div>
          <div id="membersPanel" class="tab-panel" role="tabpanel" aria-labelledby="membersTab" hidden>
            <form id="npcForm" class="npc-form" hidden><input id="npcName" maxlength="40" placeholder="NPC名" required><button type="submit">NPCを追加</button></form>
            <ul id="memberList"></ul>
          </div>
          <div id="memoPanel" class="tab-panel" role="tabpanel" aria-labelledby="memoTab" hidden>
            <textarea id="memoInput" class="memo-input" placeholder="自由にメモを入力..."></textarea>
          </div>
        </section>
        </aside>
      </div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body>
</html>
